schema: spec-driven

context: |
  i-m-senior-developer — монорепозиторий плагинов для Claude Code,
  распространяемых через GitHub как маркетплейс. Это набор инструментов
  разработки и инструкций для агентов, а не прикладной сервис.

  Плагины: planner, sdlc, tdd-master, functional-clarity, clarity-language,
  plugin-testing, llms-keeper, fpf-integration, fpf-competency-bank.
  Состав задаёт .claude-plugin/marketplace.json; версии и зависимости —
  plugins/<name>/.claude-plugin/plugin.json.

  Стек: Markdown с YAML-frontmatter для скиллов, команд и агентов;
  JSON для манифестов и хуков; Python standard library для состояния,
  резолверов, хуков и проверок; JavaScript для workflow;
  GitHub Actions и Zensical для сайта документации.

  openspec/specs/ хранит спецификации текущих возможностей.
  openspec/README.md объясняет работу со спецификациями и изменениями.
  features/ содержит требования и планы фич.
  llms-full.txt — вспомогательный снимок, который может отставать от кода.
  При расхождении проверяй действующие инструкции, исходники и тесты.

  Правила репозитория: CLAUDE.md и AGENTS.md. Для выпуска обязательно
  прочитай docs/release.md целиком. Не выполняй commit, push, создание PR,
  релиз или платные model-eval без отдельного разрешения.

  Тексты пиши по-русски; машинные заголовки и ключевые слова формата
  OpenSpec сохраняй по-английски. Не меняй контракты молча.
  Смысл промптов проверяй ревью и поведенческими примерами, не поиском слов.
  Для исполняемого поведения применяй TDD: наблюдаемое падение проверки,
  минимальное исправление, повторный запуск. Различай требование к модели
  и поведение, доказанное запуском.

  docs/plugins/ описывает возможности и связи плагинов;
  docs/testing/ — общие правила проверки. Числа наблюдённых прогонов
  остаются в aggregate-result.json и не переносятся в docs/.
  Зависимости плагинов объявляются в манифестах без ограничений версий,
  пока маркетплейс выпускается одним общим тегом.

rules:
  proposal:
    - Сначала прочитай относящиеся к задаче основные спецификации; используй их существующие пути в Modified Capabilities.
    - Опиши результат для пользователя, границы изменения и затронутые плагины; отличай уже существующее от предлагаемого.
    - Для несовместимого изменения явно назови меняющийся контракт и согласуй его с человеком до реализации.
  specs:
    - Сохраняй заголовки Requirement и Scenario, нормативное SHALL или MUST, маркеры WHEN и THEN; остальной текст пиши по-русски.
    - Описывай наблюдаемое поведение, входы, выходы и отказы; не закрепляй внутреннее устройство, если оно не является внешним контрактом.
    - Для каждого требования добавляй конкретный сценарий; где есть значимая граница, добавляй сценарий отказа или неприменимости.
    - Различай машинную проверку и инструкцию модели; не обещай гарантированное поведение модели на основании одного промпта.
  design:
    - Опирайся на существующие механизмы; обоснуй новые зависимости и абстракции, если без них нельзя решить задачу проще.
    - Назови затронутые контракты, способ проверки и ограничения доказательств; не подменяй запуск чтением кода.
    - Разреши вопросы, меняющие поведение или объём работ, до составления tasks.md.
  tasks:
    - Каждая задача должна содержать способ проверки результата и относиться к согласованным specs и design.
    - Для исполняемого поведения включай RED–GREEN–REFACTOR; для текста без детерминированного контракта указывай ревью или поведенческую проверку вместо искусственного теста.
    - Включай нужные тесты и документацию в ту же группу задач, что и соответствующее изменение.
    - Отдельно называй проверки, требующие разрешения или расходов; не отмечай их выполненными без результата.

operations:
  apply:
    guidance:
      - Сначала проверь текущую ветку и git status; сохрани чужие изменения и не расширяй согласованный объём.
  archive:
    guidance:
      - Перед архивированием сопоставь реализацию, результаты проверок и задачи; незавершённую работу не выдавай за завершённую.
      - Синхронизируй delta specs с основными спецификациями и проверь их командой openspec validate --specs --strict --no-interactive.
